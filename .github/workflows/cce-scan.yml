name: CCE scan (internet repos)

# Fuzz harness: clone public Go/Python/Java/JavaScript cloud-SDK repos and scan them with
# stackgenhq/cce-action (diagnostics on) so unmapped signatures feed StackGen
# catalog-gap ingest. The action installs cce, scans, and exports aws-iam /
# gcp-iam / azure-rbac / esbom. On a schedule it picks random repos per language
# from GitHub code search across AWS/GCP/Azure SDK markers.
# Repos already selected are listed in scanned.txt on the scanned-repos branch.
# Random picks skip that list, and a record job appends the repos from each run.
# workflow_dispatch keeps three curated repos by default; set random_repos to true
# to exercise the same random path on demand.
on:
  workflow_dispatch:
    inputs:
      filter:
        description: "cce -filter value"
        type: choice
        options: [cloud, all]
        default: cloud
      random_repos:
        description: "Pick random public repos per language instead of the curated three"
        type: boolean
        default: false
      random_repo_count:
        description: "Random repos per language (only used when random_repos is true)"
        type: string
        default: "2"
      extra_repo:
        description: 'Optional extra repo to scan, "owner/repo" (leave blank to skip)'
        type: string
        default: ""
      extra_language:
        description: "Language for extra_repo"
        type: choice
        options: [GO, JAVA, PYTHON, JAVASCRIPT, AUTO]
        default: AUTO
      extra_ref:
        description: "Branch/tag/commit for extra_repo"
        type: string
        default: "main"
  schedule:
    # Every 10 minutes. Always runs the random-repo path (see the plan job).
    # GitHub's shortest allowed interval is 5 minutes; load can still delay
    # or drop a slot, so treat this as best-effort rather than exact.
    - cron: "*/10 * * * *"

permissions:
  contents: read

concurrency:
  group: cce-scan-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Builds the scan matrix. Schedule runs, and workflow_dispatch runs with
  # random_repos=true, pick N repos per language at random from GitHub search
  # instead of the curated three, skipping repos already listed on the
  # scanned-repos branch. An optional extra ad hoc repo can be appended
  # either way via the extra_repo input.
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
    steps:
      - name: Build scan matrix
        id: build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # User token for search/code only. The Actions GITHUB_TOKEN is what
          # draws the long secondary 429s (one run was told to wait 728s).
          CODE_SEARCH_TOKEN: ${{ secrets.CODE_SEARCH_TOKEN }}
          USE_RANDOM: ${{ github.event_name == 'schedule' || inputs.random_repos == true }}
          RANDOM_REPO_COUNT: ${{ inputs.random_repo_count || '2' }}
          EXTRA_REPO: ${{ inputs.extra_repo }}
          EXTRA_LANGUAGE: ${{ inputs.extra_language }}
          EXTRA_REF: ${{ inputs.extra_ref }}
        run: |
          set -euo pipefail

          # scanned.txt lives on its own branch so recording a scan does not
          # change this workflow file or retrigger anything on main.
          scanned=$(mktemp)
          if gh api "repos/${GITHUB_REPOSITORY}/contents/scanned.txt?ref=scanned-repos" --jq .content > /tmp/scanned.b64 2>/tmp/scanned.err; then
            base64 -d /tmp/scanned.b64 > "$scanned"
          else
            echo "::warning::could not read scanned.txt on scanned-repos, not excluding anything: $(tr '\n' ' ' < /tmp/scanned.err)"
            : > "$scanned"
          fi
          patterns=$(mktemp)
          grep -v '^#' "$scanned" | sed '/^[[:space:]]*$/d' > "$patterns" || true
          echo "excluding $(wc -l < "$patterns" | tr -d ' ') repo(s) listed on scanned-repos"

          # Code search has its own quota. The Actions token shares a small one
          # and gets secondary 429s; a user token has its own budget.
          search_token="${CODE_SEARCH_TOKEN:-}"
          if [ -z "$search_token" ]; then
            echo "::warning::CODE_SEARCH_TOKEN is unset. Code search is using the Actions GITHUB_TOKEN, which is the token that gets the long 429s."
            search_token="$GH_TOKEN"
          else
            echo "code search is using CODE_SEARCH_TOKEN"
          fi

          sleep_for_search_limit() {
            local fallback="$1"
            local wait
            wait=$(sed -n 's/.*try again in \([0-9][0-9.]*\)s.*/\1/p' /tmp/code_search_err | head -1)
            if [ -z "$wait" ]; then
              sleep "$fallback"
              return
            fi
            wait=$(awk -v w="$wait" 'BEGIN { s=int(w)+1; if (s>120) s=120; if (s<1) s=1; print s }')
            echo "code search asked for a wait; sleeping ${wait}s"
            sleep "$wait"
          }

          if [ "$USE_RANDOM" = "true" ]; then
            matrix="[]"
            # Plain repository search (stars/forks/size) picks popular repos, not
            # repos that call a cloud SDK -- a prior run picked 6 random Go/Python/Java
            # repos this way and every one scanned to 0 entitlements. GitHub *code*
            # search for an SDK import marker only returns repos that have that call
            # somewhere, so a -filter cloud scan has something to find. Each language
            # picks one AWS, GCP, or Azure marker at random so scheduled runs cover
            # more than AWS without tripling code-search traffic.
            first=true
            for pair in "GO:go" "PYTHON:python" "JAVA:java" "JAVASCRIPT:javascript"; do
              # Code search allows about 10 requests a minute per token. The gap
              # below stays under that. A 429 still names its own wait, and
              # sleep_for_search_limit follows that instead of a fixed backoff.
              if [ "$first" = "true" ]; then
                first=false
              else
                sleep 20
              fi
              lang="${pair%%:*}"
              gh_lang="${pair#*:}"
              case "$lang" in
                GO)
                  markers=("github.com/aws/aws-sdk-go" "github.com/aws/aws-sdk-go-v2" "cloud.google.com/go" "github.com/Azure/azure-sdk-for-go" "github.com/Azure/azure-sdk-for-go/sdk" "github.com/alibabacloud-go" "github.com/oracle/oci-go-sdk")
                  ;;
                PYTHON)
                  markers=("import boto3" "from google.cloud" "from azure" "from alibabacloud")
                  ;;
                JAVA)
                  markers=("com.amazonaws" "com.google.cloud" "com.azure" "io.awspring.cloud" "org.springframework.cloud.gcp" "com.aliyun" "com.oracle.bmc")
                  ;;
                JAVASCRIPT)
                  markers=("@aws-sdk/client-s3" "@azure/storage-blob" "@google-cloud/storage")
                  ;;
                *)
                  echo "::warning::unknown language $lang; skipping"
                  continue
                  ;;
              esac
              marker="${markers[$((RANDOM % ${#markers[@]}))]}"
              echo "random ${lang}: searching for marker ${marker}"
              query_string="\"${marker}\" language:${gh_lang}"
              encoded=$(jq -rn --arg q "$query_string" '$q|@uri')
              # One page is often enough. If that page is mostly repos we already
              # scanned, try the next pages before giving up on this language.
              found=""
              page=$(( (RANDOM % 5) + 1 ))
              for extra in 0 1 2; do
                this_page=$((page + extra))
                raw=""
                for attempt in 1 2 3 4; do
                  if raw=$(GH_TOKEN="$search_token" gh api "search/code?q=${encoded}&per_page=30&page=${this_page}" \
                    --jq '[.items[].repository.full_name] | unique | .[]' 2>/tmp/code_search_err); then
                    break
                  fi
                  echo "::warning::code search for ${lang} page ${this_page} failed (attempt ${attempt}): $(cat /tmp/code_search_err)"
                  raw=""
                  sleep_for_search_limit $((attempt * 30))
                done
                if [ -z "$raw" ]; then
                  continue
                fi
                unseen="$raw"
                if [ -s "$patterns" ]; then
                  unseen=$(printf '%s\n' "$raw" | grep -vxF -f "$patterns" || true)
                fi
                found=$(printf '%s\n%s\n' "$found" "$unseen" | sed '/^$/d' | sort -u)
                have=$(printf '%s\n' "$found" | sed '/^$/d' | wc -l | tr -d ' ')
                if [ "$have" -ge "$RANDOM_REPO_COUNT" ]; then
                  break
                fi
                if [ "$extra" -eq 2 ]; then
                  break
                fi
                echo "only ${have} unseen ${lang} repo(s) after page ${this_page}, trying another page"
                sleep 20
              done
              if [ -z "$found" ]; then
                echo "::warning::no unseen ${lang} repos this run"
                continue
              fi
              # Ask for a few extra candidates so the size filter below can drop
              # oversized repos without leaving the language under-quota.
              picks=$(printf '%s\n' "$found" | shuf -n $((RANDOM_REPO_COUNT + 5)))
              picked=0
              while IFS= read -r full_name; do
                [ -z "$full_name" ] && continue
                if [ "$picked" -ge "$RANDOM_REPO_COUNT" ]; then
                  break
                fi
                # Skip repos too big for the scan budget: google-cloud-java
                # (2.2GB, 143k files) burned a whole 20-minute job in run
                # 43075263215 without producing a report, while prowler
                # (344MB) scans fine, so 500MB is a safe cutoff.
                size=$(GH_TOKEN="$search_token" gh api "repos/${full_name}" --jq '.size' 2>/dev/null || echo 0)
                if [ "${size:-0}" -gt 500000 ]; then
                  echo "::notice::skipping ${full_name}: repo size ${size}KB exceeds the 500000KB scan budget"
                  continue
                fi
                # Code search results don't carry default_branch; the clone step
                # omits -branch for repos with no ref, which clones the default HEAD.
                item=$(jq -nc \
                  --arg name "random: $full_name ($lang)" \
                  --arg language "$lang" \
                  --arg repo "$full_name" \
                  '{name:$name, language:$language, repo:$repo, ref:""}')
                matrix=$(printf '%s' "$matrix" | jq -c --argjson e "$item" '. + [$e]')
                picked=$((picked + 1))
              done <<< "$picks"
            done
          else
            # Curated set spans AWS (eksctl, spring-cloud-aws) and multi-cloud
            # (prowler covers AWS/GCP/Azure checks). Random runs rotate SDK markers.
            matrix='[
              {"name":"eksctl (Go, AWS EKS cluster management)","language":"GO","repo":"eksctl-io/eksctl","ref":""},
              {"name":"prowler (Python, AWS/GCP/Azure security checks)","language":"PYTHON","repo":"prowler-cloud/prowler","ref":""},
              {"name":"spring-cloud-aws (Java, AWS SDK v2 integration)","language":"JAVA","repo":"awspring/spring-cloud-aws","ref":""}
            ]'
          fi

          if [ -n "$EXTRA_REPO" ]; then
            extra=$(jq -nc \
              --arg name "extra: $EXTRA_REPO" \
              --arg language "$EXTRA_LANGUAGE" \
              --arg repo "$EXTRA_REPO" \
              --arg ref "$EXTRA_REF" \
              '{name:$name, language:$language, repo:$repo, ref:$ref}')
            matrix=$(printf '%s' "$matrix" | jq -c --argjson e "$extra" '. + [$e]')
          fi

          echo "matrix=$(printf '%s' "$matrix" | jq -c '{include: .}')" >> "$GITHUB_OUTPUT"

  scan:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - name: Clone ${{ matrix.repo }}${{ matrix.ref != '' && format('@{0}', matrix.ref) || '' }}
        id: clone
        run: |
          set -euo pipefail
          safe_name="$(echo '${{ matrix.repo }}' | tr '/' '_')"
          echo "safe_name=$safe_name" >> "$GITHUB_OUTPUT"
          if [ -n "${{ matrix.ref }}" ]; then
            git clone --depth 1 --branch "${{ matrix.ref }}" "https://github.com/${{ matrix.repo }}.git" target-repo
          else
            git clone --depth 1 "https://github.com/${{ matrix.repo }}.git" target-repo
          fi

      # Installs cce, scans target-repo, exports aws-iam/gcp-iam/azure-rbac/esbom.
      # diagnostics=true is intentional for this fuzz harness only.
      - name: Scan ${{ matrix.name }}
        id: cce
        uses: stackgenhq/cce-action@v1
        with:
          path: target-repo
          language: ${{ matrix.language }}
          filter: ${{ inputs.filter || 'cloud' }}
          output-dir: results
          diagnostics: true
          export-policies: true
          log-level: debug

      - name: Summarize
        if: always()
        env:
          REPORT: ${{ steps.cce.outputs.report-path }}
          AWS_IAM: ${{ steps.cce.outputs.aws-iam-path }}
          GCP_IAM: ${{ steps.cce.outputs.gcp-iam-path }}
          AZURE_RBAC: ${{ steps.cce.outputs.azure-rbac-path }}
          ESBOM: ${{ steps.cce.outputs.esbom-path }}
          ENTITLEMENTS: ${{ steps.cce.outputs.entitlement-count }}
          CCE_VERSION: ${{ steps.cce.outputs.version }}
        run: |
          set -euo pipefail

          list_capped() {
            local label="$1"
            shift
            local -a items=("$@")
            local n="${#items[@]}"
            if [ "$n" -eq 0 ]; then
              echo "- ${label}: none"
              return
            fi
            echo "- ${label} (${n}):"
            local i=0
            local max=40
            for item in "${items[@]}"; do
              if [ "$i" -ge "$max" ]; then
                echo "  - ... and $((n - max)) more"
                break
              fi
              echo "  - ${item}"
              i=$((i + 1))
            done
          }

          {
            echo "### ${{ matrix.name }}"
            echo
            echo "- cce: ${CCE_VERSION:-unknown}"
            if [ -n "${REPORT:-}" ] && [ -f "$REPORT" ]; then
              jq -r '
                "- Files scanned: \(.files_scanned)",
                "- Entitlements: \(.summary.total_entitlements)",
                (.summary.by_provider | to_entries[] | "  - \(.key): \(.value)")
              ' "$REPORT"
            else
              echo "- Entitlements: ${ENTITLEMENTS:-0}"
              echo "- scan produced no report"
            fi
            echo
            if [ -n "${AWS_IAM:-}" ] && [ -f "$AWS_IAM" ]; then
              mapfile -t actions < <(jq -r '[.Statement[]?.Action[]?] | unique | sort | .[]' "$AWS_IAM")
              list_capped "Minimum AWS IAM actions" "${actions[@]}"
            else
              echo "- Minimum AWS IAM actions: none"
            fi
            if [ -n "${GCP_IAM:-}" ] && [ -f "$GCP_IAM" ]; then
              mapfile -t perms < <(ruby -ryaml -e 'doc=YAML.load_file(ARGV[0])||{}; Array(doc["includedPermissions"]).uniq.sort.each{|p| puts p}' "$GCP_IAM")
              list_capped "Minimum GCP IAM permissions" "${perms[@]}"
            else
              echo "- Minimum GCP IAM permissions: none"
            fi
            if [ -n "${AZURE_RBAC:-}" ] && [ -f "$AZURE_RBAC" ]; then
              mapfile -t actions < <(jq -r '[.Actions[]?] | unique | sort | .[]' "$AZURE_RBAC")
              list_capped "Minimum Azure RBAC actions" "${actions[@]}"
            else
              echo "- Minimum Azure RBAC actions: none"
            fi
            if [ -n "${ESBOM:-}" ] && [ -f "$ESBOM" ]; then
              other=$(jq -r '
                [.entitlements[]?
                  | select((.provider | ascii_upcase) as $p
                    | ($p != "AWS" and $p != "GCP" and $p != "AZURE"))
                  | (.canonical_permission // "\(.provider)/\(.resource):\(.operation)")]
                | unique | sort | .[]
              ' "$ESBOM")
              if [ -n "$other" ]; then
                mapfile -t other_items <<< "$other"
                list_capped "Other provider permissions (E-SBOM)" "${other_items[@]}"
              else
                echo "- Other provider permissions (E-SBOM): none"
              fi
            fi
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cce-scan-${{ matrix.language }}-${{ steps.clone.outputs.safe_name }}
          path: results/*
          if-no-files-found: warn

  # Appends this run's repos to scanned.txt on scanned-repos. That branch is
  # data only, so this commit does not touch the workflow. Random selection
  # reads the file at the start of the next run and skips those repos.
  # Curated and extra repos are recorded too, so a later random run skips them.
  record:
    needs: [plan, scan]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Append repos to scanned-repos
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MATRIX: ${{ needs.plan.outputs.matrix }}
        run: |
          set -euo pipefail
          repos=$(printf '%s' "$MATRIX" | jq -r '.include[].repo // empty' | sed '/^$/d' | sort -u)
          if [ -z "$repos" ]; then
            echo "no repos to record"
            exit 0
          fi

          work=$(mktemp -d)
          gh repo clone "${GITHUB_REPOSITORY}" "$work" -- --depth 1 --branch scanned-repos --single-branch
          cd "$work"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          touch scanned.txt

          body=$(mktemp)
          grep -v '^#' scanned.txt | sed '/^[[:space:]]*$/d' > "$body" || true
          printf '%s\n' "$repos" >> "$body"
          sort -u "$body" -o "$body"
          {
            grep '^#' scanned.txt || true
            cat "$body"
          } > scanned.txt.new
          mv scanned.txt.new scanned.txt

          git add scanned.txt
          if git diff --cached --quiet; then
            echo "scanned.txt already contains these repos"
            exit 0
          fi
          git commit -m "Record repos from run ${GITHUB_RUN_ID}"
          gh auth setup-git
          git push origin HEAD:scanned-repos
