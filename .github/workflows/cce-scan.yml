name: CCE scan (internet repos)

# Downloads the latest `cce` release referenced by
# https://github.com/stackgenhq/homebrew-stackgen/blob/main/cce.rb, then runs it
# with -diagnostics against public Go/Python/Java repos, so cce reports any method
# signature it can't map to Stackgen's catalog-gap ingest. On a schedule it picks
# random repos per language from GitHub search, which is the point: a wide, varied
# sample surfaces more distinct unmapped call signatures than a fixed repo list.
# workflow_dispatch keeps three curated repos by default; set random_repos to true
# to exercise the same random path on demand.
on:
  workflow_dispatch:
    inputs:
      filter:
        description: "cce -filter value"
        type: choice
        options: [cloud, all]
        default: cloud
      random_repos:
        description: "Pick random public repos per language instead of the curated three"
        type: boolean
        default: false
      random_repo_count:
        description: "Random repos per language (only used when random_repos is true)"
        type: string
        default: "2"
      extra_repo:
        description: 'Optional extra repo to scan, "owner/repo" (leave blank to skip)'
        type: string
        default: ""
      extra_language:
        description: "Language for extra_repo"
        type: choice
        options: [GO, JAVA, PYTHON, JAVASCRIPT, AUTO]
        default: AUTO
      extra_ref:
        description: "Branch/tag/commit for extra_repo"
        type: string
        default: "main"
  schedule:
    # Daily at 06:00 UTC. Always runs the random-repo path (see the plan job).
    - cron: "0 6 * * *"

permissions:
  contents: read

concurrency:
  group: cce-scan-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Builds the scan matrix. Schedule runs, and workflow_dispatch runs with
  # random_repos=true, pick N repos per language at random from GitHub search
  # instead of the curated three. An optional extra ad hoc repo can be appended
  # either way via the extra_repo input.
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
    steps:
      - name: Build scan matrix
        id: build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USE_RANDOM: ${{ github.event_name == 'schedule' || inputs.random_repos == true }}
          RANDOM_REPO_COUNT: ${{ inputs.random_repo_count || '2' }}
          EXTRA_REPO: ${{ inputs.extra_repo }}
          EXTRA_LANGUAGE: ${{ inputs.extra_language }}
          EXTRA_REF: ${{ inputs.extra_ref }}
        run: |
          set -euo pipefail

          if [ "$USE_RANDOM" = "true" ]; then
            matrix="[]"
            # stars/forks/size bound the pool to real, maintained projects and keep
            # clone+scan time bounded by excluding kernel-scale monorepos (size is in KB).
            for pair in "GO:go" "PYTHON:python" "JAVA:java"; do
              lang="${pair%%:*}"
              gh_lang="${pair##*:}"
              page=$(( (RANDOM % 5) + 1 ))
              picks=$(gh api "search/repositories?q=language:${gh_lang}+stars:100..3000+forks:20..2000+size:<200000+archived:false&sort=stars&order=desc&per_page=100&page=${page}" \
                --jq '[.items[] | {full_name, default_branch}] | .[] | [.full_name, .default_branch] | @tsv' \
                | shuf -n "$RANDOM_REPO_COUNT")
              while IFS=$'\t' read -r full_name default_branch; do
                [ -z "$full_name" ] && continue
                item=$(jq -nc \
                  --arg name "random: $full_name ($lang)" \
                  --arg language "$lang" \
                  --arg repo "$full_name" \
                  --arg ref "$default_branch" \
                  '{name:$name, language:$language, repo:$repo, ref:$ref}')
                matrix=$(printf '%s' "$matrix" | jq -c --argjson e "$item" '. + [$e]')
              done <<< "$picks"
            done
          else
            matrix='[
              {"name":"eksctl (Go, AWS EKS cluster management)","language":"GO","repo":"eksctl-io/eksctl","ref":"main"},
              {"name":"prowler (Python, AWS/GCP/Azure security checks)","language":"PYTHON","repo":"prowler-cloud/prowler","ref":"master"},
              {"name":"spring-cloud-aws (Java, AWS SDK v2 integration)","language":"JAVA","repo":"awspring/spring-cloud-aws","ref":"main"}
            ]'
          fi

          if [ -n "$EXTRA_REPO" ]; then
            extra=$(jq -nc \
              --arg name "extra: $EXTRA_REPO" \
              --arg language "$EXTRA_LANGUAGE" \
              --arg repo "$EXTRA_REPO" \
              --arg ref "$EXTRA_REF" \
              '{name:$name, language:$language, repo:$repo, ref:$ref}')
            matrix=$(printf '%s' "$matrix" | jq -c --argjson e "$extra" '. + [$e]')
          fi

          echo "matrix=$(printf '%s' "$matrix" | jq -c '{include: .}')" >> "$GITHUB_OUTPUT"

  scan:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      # cce.rb is GoReleaser-generated and always has this exact shape: a top-level
      # `version`, then on_macos/on_linux blocks, each with an intel-64-bit and an
      # arm-64-bit sub-block carrying `url` + `sha256`. GitHub Actions runners are
      # linux amd64, so we only need the first sub-block of on_linux.
      - name: Resolve latest cce from the Homebrew formula
        id: cce
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          formula="$(gh api repos/stackgenhq/homebrew-stackgen/contents/cce.rb --jq '.content' | base64 -d)"

          version=$(printf '%s\n' "$formula" | grep -m1 -E '^\s*version "' | sed -E 's/.*version "([^"]+)".*/\1/')
          if [ -z "$version" ]; then
            echo "::error::could not parse cce version from the Homebrew formula"
            exit 1
          fi

          linux_block=$(printf '%s\n' "$formula" | awk '/on_linux do/{flag=1} flag{print} flag && /^  end$/{exit}')
          url=$(printf '%s\n' "$linux_block" | awk '/Hardware::CPU\.intel\? && Hardware::CPU\.is_64_bit\?/{found=1; next} found && /url "/{print; exit}' | sed -E 's/.*url "([^"]+)".*/\1/')
          sha256=$(printf '%s\n' "$linux_block" | awk '/Hardware::CPU\.intel\? && Hardware::CPU\.is_64_bit\?/{found=1; next} found && /sha256 "/{print; exit}' | sed -E 's/.*sha256 "([^"]+)".*/\1/')
          if [ -z "$url" ] || [ -z "$sha256" ]; then
            echo "::error::could not parse the linux amd64 url/sha256 from the Homebrew formula"
            exit 1
          fi

          echo "cce $version -> $url"
          {
            echo "version=$version"
            echo "url=$url"
            echo "sha256=$sha256"
          } >> "$GITHUB_OUTPUT"

      - name: Download and verify cce ${{ steps.cce.outputs.version }}
        run: |
          set -euo pipefail
          curl -fsSL -o cce.tar.gz "${{ steps.cce.outputs.url }}"
          echo "${{ steps.cce.outputs.sha256 }}  cce.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin"
          tar xzf cce.tar.gz -C "$HOME/.local/bin" cce
          chmod +x "$HOME/.local/bin/cce"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: cce --version
        run: cce --version

      - name: Clone ${{ matrix.repo }}@${{ matrix.ref }}
        run: git clone --depth 1 --branch "${{ matrix.ref }}" "https://github.com/${{ matrix.repo }}.git" target-repo

      # -diagnostics opts in to Stackgen's catalog-gap reports (off by default in cce);
      # -log-level debug is the only way a failed report surfaces at all, since a
      # successful post isn't logged. NOTE: cce posts diagnostics from a background
      # goroutine with its own 5s timeout and does not wait for it before returning,
      # so on a fast scan the process can exit before the POST finishes. Debug logs
      # here show attempts/failures but can't confirm a report actually landed.
      - name: Scan ${{ matrix.name }}
        id: scan
        run: |
          set -euo pipefail
          mkdir -p results
          safe_name="$(echo '${{ matrix.repo }}' | tr '/' '_')"
          echo "safe_name=$safe_name" >> "$GITHUB_OUTPUT"
          cce --folder target-repo \
              --language "${{ matrix.language }}" \
              --filter "${{ inputs.filter || 'cloud' }}" \
              --format json \
              --diagnostics \
              --log-level debug \
              --output "results/${safe_name}.json"

      - name: Summarize
        if: always()
        run: |
          report="results/${{ steps.scan.outputs.safe_name }}.json"
          {
            echo "### ${{ matrix.name }}"
            echo
            if [ -f "$report" ]; then
              jq -r '
                "- Files scanned: \(.files_scanned)",
                "- Entitlements: \(.summary.total_entitlements)",
                (.summary.by_provider | to_entries[] | "  - \(.key): \(.value)")
              ' "$report"
            else
              echo "- scan produced no report"
            fi
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload scan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cce-scan-${{ matrix.language }}-${{ steps.scan.outputs.safe_name }}
          path: results/*.json
          if-no-files-found: warn
